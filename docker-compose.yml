services:
  postgres:
    image: postgres:17-alpine
    container_name: xeroflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xeroflow
      POSTGRES_USER: xeroflow
      POSTGRES_PASSWORD: xeroflow_dev
    ports:
      - "5432:5432"
    volumes:
      - xeroflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xeroflow -d xeroflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  xeroflow_pgdata:
